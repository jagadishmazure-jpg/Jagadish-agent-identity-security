[project]
name = "agent-identity-security"
version = "0.1.0"
description = "Identity security posture for humans, workload identities and AI agents on Azure, offline-first: Graph- and ARM-shaped inventory, an identity graph with privilege-path analysis, a detections catalogue, posture scores, dry-run remediation and a read-only explainer agent over MCP."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
# Pinned to the versions the tests were run with. No Azure SDK is a core dependency: the live
# collectors and the Foundry adapter import azure-identity / agent-framework-foundry lazily.
dependencies = [
  "agent-framework-core==1.19.0", # Microsoft Agent Framework: agent, chat client, function tools
  "mcp==2.2.0",                   # read-only MCP server over the identity graph
  "networkx==3.7",                # identity graph and path analysis
  "pydantic>=2.13,<3",            # structured model output
  "pyyaml==6.0.3",                # rules, crown jewels, thresholds, hints
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.9"]
live = ["azure-identity>=1.25,<2"]
foundry = ["agent-framework-foundry==1.13.1", "azure-identity>=1.25,<2"]

[project.scripts]
idsec = "idsec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idsec"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
